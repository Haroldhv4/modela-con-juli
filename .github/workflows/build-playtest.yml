name: Build Modela con Juli Playtest

on:
  workflow_dispatch:
  push:
    branches:
      - feature/open-source-fashion-base

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Export Windows playtest
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Windows Desktop
          export_debug: true
          archive_output: true
          cache: true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModelaConJuli-Windows
          path: ${{ steps.export.outputs.archive_directory }}/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Android playtest
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          archive_output: true
          cache: true

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModelaConJuli-Android
          path: ${{ steps.export.outputs.archive_directory }}/*
          if-no-files-found: error
          retention-days: 14
